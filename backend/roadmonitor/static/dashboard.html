<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Monitor — Road Condition Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --text:#dbe4f0; --muted:#8fa0b8; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }
  #map { flex:1; }
  .side { width:400px; background:var(--panel); overflow-y:auto; padding:14px; border-left:1px solid #26314a; }
  h1 { font-size:16px; margin:0 0 10px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  select, button { background:#232c42; color:var(--text); border:1px solid #33405e; border-radius:6px; padding:5px 9px; cursor:pointer; }
  button:hover { background:#2d3a55; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; color:var(--muted); font-weight:600; padding:4px 6px; border-bottom:1px solid #33405e; position:sticky; top:0; background:var(--panel); }
  td { padding:4px 6px; border-bottom:1px solid #223047; }
  tr.row:hover { background:#202a40; cursor:pointer; }
  .badge { display:inline-block; min-width:20px; text-align:center; border-radius:5px; font-weight:700; color:#0b0f18; }
  .A { background:#3fdc74; } .B { background:#a8d841; } .C { background:#f2b23e; } .D { background:#ef4d4d; color:#fff;}
  .muted { color:var(--muted); }
  .num { text-align:right; font-variant-numeric: tabular-nums; }
  #stats { color:var(--muted); font-size:12.5px; margin-bottom:8px; }
</style>
</head>
<body>
  <div id="map"></div>
  <div class="side">
    <h1>Road Monitor — priority view</h1>
    <div id="stats">loading…</div>
    <div class="bar">
      <select id="f-class">
        <option value="">class: all</option><option>A</option><option>B</option><option>C</option><option>D</option>
      </select>
      <select id="f-status">
        <option value="candidate">status: candidate+</option>
        <option value="confirmed">confirmed only</option>
        <option value="all">all</option>
      </select>
      <button onclick="load()">⟳ refresh</button>
      <button onclick="recompute()" title="re-run aggregation server-side">⚙ recompute</button>
    </div>
    <table>
      <thead><tr><th>cls</th><th>road link</th><th class="num">score</th><th class="num">conf</th><th class="num">prio</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="muted" style="font-size:11.5px">Classes A(finest)→D(worst) from percentile cuts;
       prio = class × confidence × recency. Events clustered only from GPS-valid rows.</p>
  </div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([22.75, 78.7], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'© OpenStreetMap contributors'}).addTo(map);
const circles = [];
const API = '/api/v1/analysis';

async function load() {
  const cls = document.getElementById('f-class').value;
  const st  = document.getElementById('f-status').value;
  circles.forEach(c => map.removeLayer(c)); circles.length = 0;
  const [links, events] = await Promise.all([
    fetch(`${API}/links?min_status=${st}&limit=5000`).then(r => r.json()),
    fetch(`${API}/events?min_status=${st}&limit=5000`).then(r => r.json()),
  ]);
  const shown = links.filter(l => !cls || l.class === cls);
  document.getElementById('stats').textContent =
    `${shown.length} links shown · ${links.length} total · ${events.length} event clusters`;

  shown.forEach(l => {
    const c = L.circleMarker([l.lat, l.lon], {
      radius: 6 + 5*(l.confidence||0), weight: 2, color: '#1b2334',
      fillColor: {'A':'#3fdc74','B':'#a8d841','C':'#f2b23e','D':'#ef4d4d'}[l.class] || '#888',
      fillOpacity: 0.85,
    }).addTo(map);
    c.bindPopup(`<b>class ${l.class}</b> · prio ${l.prio ?? '—'}<br>
      score ${(+l.score_raw).toFixed(2)} m/s² (norm ${(l.score_norm??0).toFixed(2)})<br>
      ${l.n_trips} trips · ${l.n_devices} devices · ${l.n_bins} bins · conf ${l.confidence}<br>
      status ${l.status}`);
    circles.push(c);
  });
  events.forEach(e => {
    const c = L.circleMarker([e.lat, e.lon], {
      radius: 5 + Math.min(8, e.n_events), weight: 1, color: '#fff',
      fillColor: '#7b5cff', fillOpacity: 0.55,
    }).addTo(map);
    c.bindPopup(`<b>${e.type}</b> ×${e.n_events}<br>peak ${(+e.peak_med).toFixed(1)} m/s² · width ${(e.width_med??0).toFixed(0)} ms<br>
      ${e.n_trips} trips · ${e.n_devices} devices · ${e.status} · conf ${e.confidence}`);
    circles.push(c);
  });
  if (shown.length + events.length) {
    const g = L.featureGroup(circles); map.fitBounds(g.getBounds().pad(0.15));
  }

  const prio = await fetch(`${API}/priority?min_status=${st}&limit=5000`).then(r => r.json());
  const tb = document.getElementById('rows'); tb.innerHTML = '';
  prio.filter(l => !cls || l.class === cls).slice(0, 200).forEach(l => {
    const tr = document.createElement('tr'); tr.className = 'row';
    tr.innerHTML = `<td><span class="badge ${l.class}">${l.class}</span></td>
      <td class="muted">${l.lat.toFixed(5)}, ${l.lon.toFixed(5)}</td>
      <td class="num">${(+l.score_raw).toFixed(2)}</td>
      <td class="num">${(l.confidence*100).toFixed(0)}%</td>
      <td class="num"><b>${l.priority.toFixed(2)}</b></td>`;
    tr.onclick = () => map.setView([l.lat, l.lon], 16);
    tb.appendChild(tr);
  });
}

async function recompute() {
  document.getElementById('stats').textContent = 'recomputing…';
  await fetch(`${API}/recompute`, {method:'POST'});
  load();
}

document.getElementById('f-class').onchange = load;
document.getElementById('f-status').onchange = load;
load();
</script>
</body>
</html>
